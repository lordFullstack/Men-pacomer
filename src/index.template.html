<head>

       actualízalos aquí si cambias el nombre o la portada del negocio. -->
  <meta property="og:type" content="website"/>
  <meta property="og:locale" content="es_CO"/>
  <meta property="og:title" content="Pa comer express · Menú"/>
  <meta property="og:description" content="Desayunos | juguería | fast food | refrigerios. Arma tu plato y pide por WhatsApp."/>
  <meta property="og:image" content="https://jhuwepkpjjvponryzykp.supabase.co/storage/v1/object/public/productos-img/negocio/1785858851984.png"/>

  <link rel="preconnect" href="https://jhuwepkpjjvponryzykp.supabase.co" crossorigin/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;background:#fdf8f4;min-height:100vh;color:#2c1a0e;-webkit-tap-highlight-color:transparent;}
    button,input,select,textarea{font-family:inherit;}
    :focus-visible{outline:3px solid #f0a500;outline-offset:2px;}
    input:focus,select:focus,textarea:focus{border-color:#3f7d2a!important;box-shadow:0 0 0 3px rgba(63,125,42,.2);}
    .cats{scrollbar-width:none;}
    .cats::-webkit-scrollbar{display:none;}
    /* Firma Synaptix AI Labs. Colores de .splash__by/.splash__brand adaptados a fondo claro
       (el original usa #8A93C9 y #fff, pensados para splash oscuro) */
    .splash__sign{display:flex;flex-direction:column;align-items:center;gap:2px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;}
    .splash .splash__sign{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);animation:sp-up .5s ease .8s both;}
    .splash__by{font-size:10px;letter-spacing:.06em;color:#6b7280;}
    .splash__brand{font-size:14px;font-weight:800;color:#2c1a0e;letter-spacing:-.01em;}
    .splash__ai{font-weight:700;background:linear-gradient(90deg,#00E5FF,#0066FF,#8A2BE2,#00E5FF);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sp-grad 6s linear infinite;}
    @keyframes sp-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes sp-grad{to{background-position:300% 0}}
    @keyframes popIn{0%{transform:scale(0.5);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
    @keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
    ::-webkit-scrollbar{width:5px;}
    ::-webkit-scrollbar-thumb{background:#6ab04c;border-radius:4px;}
  </style>
</head>
<body>
<noscript><p style="padding:24px;text-align:center">Activa JavaScript para ver el menú.</p></noscript>
<div id="root"></div>
<!--APP_SCRIPT-->
</body>
</html>
